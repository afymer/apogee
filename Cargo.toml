[workspace]
resolver = "3"
members = [
    "crates/apogee",
    "crates/daemon",
    "crates/protocol",
    "crates/controller",
    "crates/sequencer",
    "crates/planetarium",
    "crates/workspace",
    "crates/theme",
    "crates/ui",
    "crates/status_bar",
    "crates/drivers/gphoto"
]
default-members = ["crates/apogee"]
# exclude = ["vendor/zed"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
thiserror = "2.0.20"
futures = "0.3.34"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0"
wgpu = "29.0.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
gpui = { git = "https://github.com/afymer/zed.git", branch = "wgpu-surface-sharing" }
gpui_platform = { git = "https://github.com/afymer/zed.git", branch = "wgpu-surface-sharing", features = ["font-kit", "wayland", "x11", "wgpu"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_color",
    "bevy_pbr",
    "multi_threaded",
    "zstd_rust",
    "tonemapping_luts",
    "png",
    "jpeg",
] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
uninlined_format_args = "allow"
unreadable_literal = "allow"
float_cmp = "allow"
doc_markdown = "allow"
similar_names = "allow"
needless_continue = "allow"
manual_range_contains = "allow"
struct_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
needless_raw_string_hashes = "allow"
match_wildcard_for_single_variants = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
unused_self = "allow"
duration_suboptimal_units = "allow"
needless_range_loop = "allow"
single_match = "allow"
single_match_else = "allow"
assign_op_pattern = "allow"
unnecessary_map_or = "allow"
cast_lossless = "allow"
type_complexity = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
match_same_arms = "allow"
manual_clamp = "allow"
approx_constant = "allow"

# As recommended by the Bevy docs
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "off"

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
debug = 0

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/afymer/zed.git", branch = "wgpu-surface-sharing", version = "0.2.2" }
gpui_platform = { git = "https://github.com/afymer/zed.git", branch = "wgpu-surface-sharing" }
gpui_macros = { git = "https://github.com/afymer/zed.git", branch = "wgpu-surface-sharing" }

[patch.crates-io]
gpui = { git = "https://github.com/afymer/zed.git", branch = "wgpu-surface-sharing", version = "0.2.2" }
gpui_platform = { git = "https://github.com/afymer/zed.git", branch = "wgpu-surface-sharing" }
